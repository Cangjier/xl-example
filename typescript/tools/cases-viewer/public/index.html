<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tts 用例查看器 · typescript/cases/tts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f131a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234c8dff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/" title="回到总览">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">tts 用例查看器</span>
    </a>
    <code class="brand-path" id="root-path">typescript/cases/tts</code>
    <div class="topbar-stats" id="topbar-stats"></div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-check-all" title="跑一次 run.mjs --all --list，把结果标回左侧列表">
        <span class="btn-dot"></span>全部对拍
      </button>
      <button class="btn btn-ghost" id="btn-docs" title="打开 tts.md / index.md">说明</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="搜索 路径 / 类别 / 源码" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>

      <div class="filters" id="filters">
        <div class="filter-row" id="status-filters">
          <button class="chip is-on" data-status="all">全部</button>
          <button class="chip" data-status="success">success</button>
          <button class="chip" data-status="todo">todo</button>
        </div>
        <div class="filter-row">
          <button class="chip chip-dot" data-flag="md"><i class="dot md"></i>有 case.md</button>
          <button class="chip chip-dot" data-flag="ast"><i class="dot ast"></i>有 case.ast</button>
        </div>
      </div>

      <div class="group-bar">
        <label for="group-select">类别</label>
        <select id="group-select"><option value="">全部类别</option></select>
      </div>

      <div class="list-meta" id="list-meta"></div>
      <div class="case-list" id="case-list" role="listbox" aria-label="用例列表"></div>

      <footer class="sidebar-foot" id="sidebar-foot"></footer>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
